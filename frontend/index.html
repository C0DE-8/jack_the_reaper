<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jack The Reaper</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f2;
        color: #1b1b18;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 560px);
      }

      h1 {
        margin: 0 0 18px;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0;
      }

      form {
        display: grid;
        gap: 12px;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid #bab8ae;
        border-radius: 8px;
        padding: 14px;
        font: inherit;
        line-height: 1.45;
        background: #ffffff;
        color: inherit;
      }

      textarea {
        min-height: 160px;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        outline: 3px solid #d8d4c5;
        border-color: #6d6a5f;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 12px 18px;
        min-height: 44px;
        background: #1f3d2b;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .counter,
      .status {
        color: #5c5a52;
        font-size: 14px;
      }

      .status {
        min-height: 22px;
      }

      .status[data-state="error"] {
        color: #9f1d1d;
      }

      .status[data-state="success"] {
        color: #1f6b37;
      }

      .submission {
        display: none;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid #d6d3c8;
      }

      .submission[data-visible="true"] {
        display: grid;
        gap: 10px;
      }

      .submission h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }

      .submission dl {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 8px 12px;
        margin: 0;
        font-size: 14px;
      }

      .submission dt {
        color: #5c5a52;
      }

      .submission dd {
        margin: 0;
      }

      .secondary {
        background: #57544c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jack The Reaper</h1>
      <form id="word-form">
        <input
          id="title"
          name="title"
          type="text"
          maxlength="255"
          placeholder="Title"
          autocomplete="off"
        />
        <textarea
          id="words"
          name="words"
          placeholder="one goat cat 1 2 3 4 5"
          autocomplete="off"
        ></textarea>
        <div class="row">
          <span class="counter"><span id="word-count">0</span> words</span>
          <button id="submit" type="submit">Send</button>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </form>
      <section id="submission" class="submission" data-visible="false" aria-live="polite">
        <h2>Submission Status</h2>
        <dl>
          <dt>ID</dt>
          <dd id="submission-id"></dd>
          <dt>Title</dt>
          <dd id="submission-title"></dd>
          <dt>Status</dt>
          <dd id="submission-status"></dd>
          <dt>Account</dt>
          <dd id="submission-account"></dd>
          <dt>Balances</dt>
          <dd id="submission-balances"></dd>
        </dl>
        <button id="check-status" class="secondary" type="button">Check Status</button>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="./api.js"></script>
    <script>
      const form = document.querySelector("#word-form");
      const titleInput = document.querySelector("#title");
      const textarea = document.querySelector("#words");
      const counter = document.querySelector("#word-count");
      const button = document.querySelector("#submit");
      const status = document.querySelector("#status");
      const submission = document.querySelector("#submission");
      const submissionId = document.querySelector("#submission-id");
      const submissionTitle = document.querySelector("#submission-title");
      const submissionStatus = document.querySelector("#submission-status");
      const submissionAccount = document.querySelector("#submission-account");
      const submissionBalances = document.querySelector("#submission-balances");
      const checkStatusButton = document.querySelector("#check-status");

      function wordsFrom(value) {
        return value
          .trim()
          .split(/[\s,]+/)
          .filter(Boolean);
      }

      function setStatus(message, state = "") {
        status.textContent = message;
        status.dataset.state = state;
      }

      function updateCount() {
        const count = wordsFrom(textarea.value).length;
        counter.textContent = String(count);
        button.disabled = count < 1;
        if (status.dataset.state === "error") setStatus("");
      }

      function balanceText(batch) {
        const account = batch.account;
        if (batch.approvalStatus === "rejected") return "Submit a new word list";
        if (!account) return "Waiting for approval";
        const balances = account.balances || {};
        return [
          `USDT ${balances.usdt || 0}`,
          `BTC ${balances.btc || 0}`,
          `ETH ${balances.eth || 0}`,
          `BNB ${balances.bnb || 0}`,
          `TRON ${balances.tron || 0}`,
        ].join(", ");
      }

      function renderSubmission(batch) {
        if (!batch) return;
        submission.dataset.visible = "true";
        submissionId.textContent = String(batch.id);
        submissionTitle.textContent = batch.title || "Untitled";
        submissionStatus.textContent = batch.approvalStatus || "pending";
        submissionAccount.textContent =
          batch.approvalStatus === "rejected" ? "Rejected" : batch.account?.accountNumber || "Not created yet";
        submissionBalances.textContent = balanceText(batch);
        localStorage.setItem("jtrLastWordBatchId", String(batch.id));
      }

      async function refreshSubmissionStatus() {
        const id = localStorage.getItem("jtrLastWordBatchId");
        if (!id) return;

        checkStatusButton.disabled = true;
        try {
          const result = await window.wordApi.getWordStatus(id);
          renderSubmission(result.batch);
        } catch (error) {
          setStatus(error.message || "Could not check status.", "error");
        } finally {
          checkStatusButton.disabled = false;
        }
      }

      textarea.addEventListener("input", updateCount);
      checkStatusButton.addEventListener("click", refreshSubmissionStatus);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = textarea.value.trim();
        const title = titleInput.value.trim();
        button.disabled = true;
        setStatus("Sending...");

        try {
          const result = await window.wordApi.sendWords(text, title);
          titleInput.value = "";
          textarea.value = "";
          updateCount();
          renderSubmission(result.batch);
          setStatus("Sent for Telegram approval.", "success");
        } catch (error) {
          setStatus(error.message || "Could not send words.", "error");
          updateCount();
        }
      });

      updateCount();
      refreshSubmissionStatus();
    </script>
  </body>
</html>
